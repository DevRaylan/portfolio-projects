<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Gorjetas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%AE</text></svg>">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chips.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/resultado.css">
    <link rel="stylesheet" href="css/mesas.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>
    <h1>Calculadora de Gorjetas</h1>

    <div class="barra-acoes">
        <button id="btn-abrir-atendentes" type="button">Atendentes</button>
        <button id="btn-abrir-mesas" type="button">Mesas</button>
        <button id="btn-abrir-percentuais" type="button">Percentuais</button>
    </div>

    <div id="modal-atendentes" class="modal-overlay oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2>Atendentes</h2>
                <button id="btn-fechar-atendentes" type="button" class="botao-fechar">×</button>
            </div>
            <form id="form-atendente">
                <input type="text" id="input-nome" placeholder="Nome do atendente" required>
                <button type="submit">Adicionar</button>
            </form>
            <ul id="lista-gerenciar-atendentes" class="lista-gerenciar-atendentes"></ul>
        </div>
    </div>

    <div id="modal-mesas" class="modal-overlay oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2>Mesas</h2>
                <button id="btn-fechar-mesas" type="button" class="botao-fechar">×</button>
            </div>
            <form id="form-mesa">
                <input type="number" id="input-numero-mesa-nova" placeholder="Número da mesa" step="1" min="1" required>
                <button type="submit">Adicionar</button>
            </form>
            <ul id="lista-gerenciar-mesas" class="lista-gerenciar-atendentes"></ul>
        </div>
    </div>

    <div id="modal-percentuais" class="modal-overlay oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2>Percentuais</h2>
                <button id="btn-fechar-percentuais" type="button" class="botao-fechar">×</button>
            </div>
            <form id="form-percentual">
                <input type="number" id="input-valor-percentual-novo" placeholder="Percentual (%)" step="0.01" min="0" required>
                <button type="submit">Adicionar</button>
            </form>
            <ul id="lista-gerenciar-percentuais" class="lista-gerenciar-atendentes"></ul>
        </div>
    </div>

    <div id="modal-mesa-detalhe" class="modal-overlay oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2 id="titulo-mesa-detalhe">Mesa</h2>
                <button id="btn-fechar-mesa-detalhe" type="button" class="botao-fechar">×</button>
            </div>
            <div id="corpo-mesa-detalhe"></div>
        </div>
    </div>

    <div class="layout-principal">
        <section class="secao-mesas">
            <h2>Mesas</h2>
            <div id="grade-mesas" class="grade-mesas"></div>
        </section>

            <section class="secao-historico">
            <h2>Histórico</h2>
            <div id="nav-dias-historico" class="nav-dias"></div>
            <ul id="lista-historico"></ul>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
