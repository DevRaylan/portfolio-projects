<VirtualHost *:8080>
        ServerAdmin sead.reitoria@udesc.br

        DocumentRoot /var/www/public
		
		SetEnv AMBIENTE DEV

        SetEnvIf Authorization .+ HTTP_AUTHORIZATION=$0

        <Directory />
                Options FollowSymLinks
                AllowOverride All
        </Directory>
        
    	<Directory /var/www/public>
                Options FollowSymLinks
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>

        LogLevel warn
        CustomLog /dev/stdout combined
        ErrorLog /dev/stdout

</VirtualHost>
