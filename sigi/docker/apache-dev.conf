<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    SetEnv AMBIENTE DEV

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        # index.php força ini_set('display_errors', 1) em tempo de execução; php_admin_flag
        # tem precedência sobre isso e evita que warnings quebrem o session_start().
        php_admin_flag display_errors Off
        php_admin_flag log_errors On
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
