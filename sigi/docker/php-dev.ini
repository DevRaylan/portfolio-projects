; Espelha o comportamento de build/dev/php.ini original: display_errors Off,
; senão avisos do PHP7.4 (ex: "continue" em switch) são impressos antes do
; session_start() e quebram a sessão ("headers already sent").
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 500M
